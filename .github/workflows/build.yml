name: Build TWRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-12.1
          - twrp-11
      DEVICE_TREE:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/Zourryy/device_itel_tssi'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/itel/tssi'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'tssi'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'boot'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex \
          g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
          lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Initialize repo
        run: |
          mkdir workspace
          cd workspace
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Sync repo
        run: |
          cd workspace
          repo sync -j$(nproc --all) --force-sync

      - name: Clone device tree
        run: |
          cd workspace
          git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

      - name: Build TWRP
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng
          mka ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-${{ github.event.inputs.DEVICE_NAME }}
          path: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
